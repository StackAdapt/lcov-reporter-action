name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build before test: the smoke tests load the compiled
      # dist/main.js, and running the build first also surfaces
      # missing-file / bundler-config regressions early.
      - run: npm run build
      # Guard against committed-bundle drift: GitHub's Actions runner
      # executes whatever is checked in under dist/, not whatever CI
      # rebuilds. Without this check a PR could change src/, rebuild
      # locally, commit only the src/ change, and still pass CI while
      # shipping a stale bundle to every consumer.
      - name: Ensure dist/ is up to date with src/
        run: |
          git diff --stat -- dist/ || true
          if ! git diff --exit-code -- dist/; then
            echo "::error::Files under \`dist/\` are stale. Run \`npm run build\` locally and commit the updated bundle."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- dist/)
          if [ -n "$untracked" ]; then
            echo "::error::The build produced new files under \`dist/\` that are not committed:"
            printf '  %s\n' $untracked
            echo "::error::Commit the new artefact(s) or add them to \`.gitignore\`."
            exit 1
          fi
      - run: npm test
      - run: npm run smoke
